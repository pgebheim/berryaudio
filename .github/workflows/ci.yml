name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile-check all python sources
        run: python -m compileall -q .

  # The committed web/www dist must match the frontend commit pinned in
  # web/www/.frontend-ref - this is what makes a backend build reproducible
  # and versioned against the UI that ships inside it.
  dist-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read frontend pin
        id: pin
        run: echo "sha=$(cat web/www/.frontend-ref)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: pgebheim/ba-frontend
          ref: ${{ steps.pin.outputs.sha }}
          path: ui

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build frontend at pinned commit
        working-directory: ui
        run: |
          npm ci
          npx vite build --outDir "$GITHUB_WORKSPACE/dist-check"

      - name: Compare against committed dist
        run: |
          # images/ holds runtime album art, not build output
          if diff -r -x .frontend-ref -x .gitkeep -x images dist-check web/www; then
            echo "dist matches frontend pin ${{ steps.pin.outputs.sha }}"
          else
            echo "::error::web/www does not match ba-frontend@${{ steps.pin.outputs.sha }} - rebuild the dist and update the pin"
            exit 1
          fi

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, dist-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Guards against the v5.0.0 mistake: tag said v5.0.0 but
      # version.py still said 4.1.0.
      - name: Verify version.py matches the tag
        run: |
          python - <<'EOF'
          import os, re, sys
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          ver = re.search(
              r'__version__\s*=\s*"([^"]+)"', open("version.py").read()
          ).group(1)
          if ver != tag:
              sys.exit(f"version.py says {ver} but tag is {tag}")
          print(f"version {ver} matches tag")
          EOF

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
